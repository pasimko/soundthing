[package]
authors = ["The wasm-bindgen Developers"]
edition = "2021"
name = "wasm-audio-worklet"
publish = false
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_log = "1"
eframe = "0.32.0"
egui = "0.32.0"
js-sys = "0.3.77"
log = "0.4.27"
ringbuf = "0.4.8"
serde = "1.0.219"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[dependencies.web-sys]
features = [
  "AudioContext",
  "AudioDestinationNode",
  "AudioWorklet",
  "AudioWorkletNode",
  "AudioWorkletNodeOptions",
  "Blob",
  "BlobPropertyBag",
  "Document",
  "Event",
  "HtmlInputElement",
  "HtmlLabelElement",
  "Url",
  "Window",
]
version = "0.3.77"
